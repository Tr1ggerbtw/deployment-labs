name: CI/CD Pipeline

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/simple-inventory
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          
      - name: Run flake8
        run: |
          pip install flake8
          flake8 app/ run.py --max-line-length=120 --extend-ignore=E501
          
      - name: Run hadolint
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint Dockerfile

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          
      - name: Install dependencies and test
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov python-dotenv
          pytest tests/ --cov=app --cov-fail-under=40 --cov-report=html:coverage_html
          
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage_html/
          retention-days: 30

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Target Node
    runs-on: self-hosted
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_USER }}
          password: ${{ secrets.TARGET_PASSWORD }}
          script: |
            echo "--> Оновлення коду з репозиторію..."
            cd /opt/mywebapp || exit 1
            sudo git pull origin main
            
            echo "--> Запуск скрипта розгортання..."
            export IMAGE_NAME="${{ env.IMAGE_NAME }}"
            export IMAGE_TAG="${{ github.ref_name }}"
            export DEPLOY_PORT="5200"
            export DB_HOST="127.0.0.1"
            export DB_PORT="5432"
            export DB_NAME="inventory"
            export DB_USER="app"
            export DB_PASSWORD="password123"
            
            sudo -E bash deploy/deploy_cd.sh

  verify:
    name: Verify Deployment
    runs-on: self-hosted
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Run 7-step verification via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_USER }}
          password: ${{ secrets.TARGET_PASSWORD }}
          script: |
            set -e
            APP_PORT=5200
            
            echo "[1/7] Checking systemd service is active..."
            sudo systemctl is-active --quiet mywebapp-docker.service && echo "  OK: mywebapp-docker.service is active" || { echo "  FAIL: Service not active"; exit 1; }
            
            echo "[2/7] Checking all core components are running..."
            sudo systemctl is-active --quiet nginx && echo "  OK: nginx is running" || { echo "  FAIL: nginx is down"; exit 1; }
            sudo systemctl is-active --quiet postgresql && echo "  OK: postgresql is running" || { echo "  FAIL: postgres is down"; exit 1; }
            sudo docker ps | grep -q "simple-inventory" && echo "  OK: app container is running" || { echo "  FAIL: container is down"; exit 1; }
            
            echo "[3/7] Checking app health/alive endpoint directly..."
            curl --silent --fail --max-time 10 http://localhost:${APP_PORT}/health/alive && echo -e "\n  OK: /health/alive responded" || exit 1
            
            echo "[4/7] Checking app health/ready endpoint directly..."
            curl --silent --fail --max-time 10 http://localhost:${APP_PORT}/health/ready && echo -e "\n  OK: /health/ready responded" || exit 1
            
            echo "[5/7] Checking nginx proxies / correctly..."
            HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:80/)
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then echo "  OK: nginx returns HTTP ${HTTP_CODE} for /"; else echo "  FAIL: nginx returned ${HTTP_CODE}"; exit 1; fi
            
            echo "[6/7] Checking nginx blocks health endpoints from outside (should return 403/404)..."
            HEALTH_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:80/health/ready)
            if [[ "$HEALTH_CODE" == "403" || "$HEALTH_CODE" == "404" ]]; then echo "  OK: nginx blocks /health/ready with ${HEALTH_CODE}"; else echo "  FAIL: got ${HEALTH_CODE}"; exit 1; fi
            
            echo "[7/7] Checking nginx access log is being written..."
            LOG_LINES=$(sudo wc -l < /var/log/nginx/access.log 2>/dev/null || echo 0)
            if [ "$LOG_LINES" -gt 0 ]; then echo "  OK: nginx access log has entries"; else echo "  FAIL: access log empty"; exit 1; fi
            
            echo "All checks passed! Deployment verified successfully."